[tool.ruff]
# Ruff configuration for linting and code quality
target-version = "py39"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "*.pyc",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "*.egg-info",
    "_backup_*",
    "NEW_KC_LIVER",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]

ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "exceptions",
    "utils",
    "evidence_models",
    "evidence_profiles",
    "provenance",
    "plot_utils",
    "prisma",
    "risk_of_bias",
    "rob_visualization",
    "certainty_grading",
    "reliability",
    "multi_reviewer",
    "hepatotoxicity_agent",
    "search_enhanced",
    "fulltext_retrieval",
    "rag_system",
    "hierarchical_processing",
    "active_learning",
    "calibration",
    "prompt_templates",
    "prompt_improvements",
    "causal_reasoning",
    "reproducibility",
    "validation",
    "confidence_scoring",
    "gpu_utils",
    "mpi_support",
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Respect magic trailing comma
skip-magic-trailing-comma = false
# Automatically detect the appropriate line ending
line-ending = "auto"

[tool.mypy]
# Mypy configuration for static type checking
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

# Ignore missing imports for third-party libraries that may not have type stubs
ignore_missing_imports = true

# Exclude backup directories and other non-source files
exclude = [
    ".*/_backup_.*",
    ".*/NEW_KC_LIVER/.*",
    ".*/__pycache__/.*",
    ".*/build/.*",
    ".*/dist/.*",
    ".*/\\.venv/.*",
    ".*/venv/.*",
]

# Per-module options
[[tool.mypy.overrides]]
module = [
    "Bio.*",
    "pubchempy.*",
    "langchain.*",
    "langchain_ollama.*",
    "langchain_core.*",
    "gradio.*",
    "ollama.*",
    "sentence_transformers.*",
    "mpi4py.*",
]
ignore_missing_imports = true

[tool.isort]
# isort configuration (backup/alternative to ruff)
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
    "*/_backup_*",
    "*/__pycache__",
    "*/venv",
    "*/env",
    "*/build",
    "*/dist",
    "*.egg-info"
]
known_first_party = [
    "config",
    "exceptions",
    "utils",
    "evidence_models",
    "evidence_profiles",
    "provenance",
    "plot_utils",
    "prisma",
    "risk_of_bias",
    "rob_visualization",
    "certainty_grading",
    "reliability",
    "multi_reviewer",
    "hepatotoxicity_agent",
    "search_enhanced",
    "fulltext_retrieval",
    "rag_system",
    "hierarchical_processing",
    "active_learning",
    "calibration",
    "prompt_templates",
    "prompt_improvements",
    "causal_reasoning",
    "reproducibility",
    "validation",
    "confidence_scoring",
    "gpu_utils",
    "mpi_support",
]
