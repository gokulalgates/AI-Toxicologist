[settings]
profile = black
multi_line_output = 3
line_length = 100
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
    "*/_backup_*",
    "*/__pycache__",
    "*/venv",
    "*/env",
    "*/build",
    "*/dist",
    "*.egg-info"
]
known_first_party = [
    "config",
    "exceptions",
    "utils",
    "evidence_models",
    "evidence_profiles",
    "provenance",
    "plot_utils",
    "prisma",
    "risk_of_bias",
    "rob_visualization",
    "certainty_grading",
    "reliability",
    "multi_reviewer",
    "hepatotoxicity_agent",
    "search_enhanced",
    "fulltext_retrieval",
    "rag_system",
    "hierarchical_processing",
    "active_learning",
    "calibration",
    "prompt_templates",
    "prompt_improvements",
    "causal_reasoning",
    "reproducibility",
    "validation",
    "confidence_scoring",
    "gpu_utils",
    "mpi_support"
]
known_third_party = [
    "gradio",
    "pandas",
    "pubchempy",
    "Bio",
    "langchain",
    "langchain_ollama",
    "langchain_core",
    "pydantic",
    "matplotlib",
    "seaborn",
    "networkx",
    "numpy",
    "scipy",
    "requests",
    "sentence_transformers",
    "ollama"
]
